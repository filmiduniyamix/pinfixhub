---
layout: default
title: Search
---
<div class="post-header">
  <input type="text" id="search-input" placeholder="Search posts..." style="width:100%; padding:15px; font-size:1.2rem; border-radius:12px; border: 1px solid #ccc; outline:none;">
</div>
<div class="masonry-grid" id="search-results"></div>

<script>
  fetch("{{ '/search.json' | relative_url }}")
    .then(res => res.json())
    .then(data => {
      document.getElementById('search-input').addEventListener('input', function(e) {
        const query = e.target.value.toLowerCase();
        const results = data.filter(post => 
          post.title.toLowerCase().includes(query) || post.description.toLowerCase().includes(query)
        );
        
        const resultsContainer = document.getElementById('search-results');
        resultsContainer.innerHTML = results.map(post => `
          <a href="${post.url}" class="card">
            <img src="${post.image}" alt="${post.title}">
            <div class="card-body">
              <h2 class="card-title">${post.title}</h2>
              <p class="card-excerpt">${post.description}</p>
            </div>
          </a>
        `).join('');
      });
    });
</script>
