---
layout: default
---
<article class="post">
  <div class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">{{ page.date | date: "%B %-d, %Y" }} • By Author</p>
    <div class="tags">
      {% for tag in page.tags %}
        <span class="tag">#{{ tag }}</span>
      {% endfor %}
    </div>
  </div>

  {% if page.image %}
    <img src="{{ page.image | relative_url }}" alt="{{ page.title }}" class="post-hero-image">
  {% endif %}

  <div class="post-content">
    {{ content }}
    
    <!-- Like Button System -->
    <div style="margin-top: 40px; text-align: center;">
      <button class="btn btn-like" id="like-btn" onclick="toggleLike()">
        <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        Like <span id="like-count">0</span>
      </button>
    </div>
  </div>

  <!-- Related Posts -->
  <div class="post-content" style="margin-top: 60px;">
    <h3>Related Posts</h3>
    <div class="masonry-grid" style="column-count: 2;">
      {% for related_post in site.related_posts limit:2 %}
        <a href="{{ related_post.url | relative_url }}" class="card">
          <img src="{{ related_post.image | relative_url }}" alt="{{ related_post.title }}">
          <div class="card-body">
            <h3 class="card-title">{{ related_post.title }}</h3>
          </div>
        </a>
      {% endfor %}
    </div>
  </div>

  <!-- Disqus Comments -->
  <div class="post-content" style="margin-top: 40px;" id="disqus_thread"></div>
</article>

<!-- Fullscreen Lightbox Wrapper -->
<div id="lightbox">
  <img id="lightbox-img" src="" alt="Fullscreen view">
</div>

<script>
// Lightbox Effect
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');
document.querySelectorAll('.post-content img').forEach(img => {
  img.addEventListener('click', () => {
    lightboxImg.src = img.src;
    lightbox.style.display = 'flex';
  });
});
lightbox.addEventListener('click', () => lightbox.style.display = 'none');

// LocalStorage Like/Vote System
const postId = "{{ page.id | slugify }}";
let likes = parseInt(localStorage.getItem(postId + '_likes')) || Math.floor(Math.random() * 20) + 5; 
let isLiked = localStorage.getItem(postId + '_isLiked') === 'true';

const likeCountEl = document.getElementById('like-count');
const likeBtn = document.getElementById('like-btn');
likeCountEl.innerText = likes;
if (isLiked) likeBtn.style.background = '#ffcdd2';

function toggleLike() {
  isLiked = !isLiked;
  likes = isLiked ? likes + 1 : likes - 1;
  localStorage.setItem(postId + '_likes', likes);
  localStorage.setItem(postId + '_isLiked', isLiked);
  likeCountEl.innerText = likes;
  likeBtn.style.background = isLiked ? '#ffcdd2' : '#ffebee';
}

// Disqus Initialization
var disqus_config = function () {
  this.page.url = '{{ page.url | absolute_url }}';
  this.page.identifier = '{{ page.id }}';
};
(function() {
  var d = document, s = d.createElement('script');
  s.src = 'https://{{ site.disqus_shortname }}.disqus.com/embed.js';
  s.setAttribute('data-timestamp', +new Date());
  (d.head || d.body).appendChild(s);
})();
</script>
