---
layout: default
title: Categories
---
<div class="categories-page">
  <h1>Categories</h1>
  <div class="category-list">
    {% for category in site.categories %}
      <h2 id="{{ category[0] | slugify }}">{{ category[0] }}</h2>
      <ul>
        {% for post in category[1] %}
          <li><a href="{{ post.url }}">{{ post.title }}</a> - {{ post.date | date: "%B %d, %Y" }}</li>
        {% endfor %}
      </ul>
    {% endfor %}
  </div>
</div>
